<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر my story</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta name="description" content="متجر my story لأحدث الأزياء والإلكترونيات بأفضل الأسعار.">
<meta name="keywords" content="متجر my story, تسوق، أزياء، إلكترونيات">
<meta <meta name="google-site-verification" content="lsdJnqaEByvakIyIVgukwCrxSmLVUjZCq6NEvZKlk5c" /> </head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-40 w-full bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-shopping-bag text-2xl text-indigo-600"></i>
          <span class="font-bold text-2xl text-gray-900">متجر my story</span>
        </div>
        <nav class="hidden md:flex gap-8">
          <a href="#" class="text-gray-600 hover:text-indigo-600 font-medium">الرئيسية</a>
          <a href="#products" class="text-gray-600 hover:text-indigo-600 font-medium">المنتجات</a>
        </nav>
        <button onclick="toggleCart()" class="relative p-2 text-gray-600 hover:bg-gray-100 rounded-full">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span id="cart-count" class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold px-1.5 py-0.2 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="bg-indigo-900 text-white py-20 text-center">
    <h1 class="text-4xl font-extrabold mb-4">اكتشف أحدث المنتجات</h1>
    <p class="text-lg text-indigo-100 mb-8">تسوق الآن بأفضل الأسعار</p>
    <a href="#products" class="bg-white text-indigo-900 font-bold px-8 py-3 rounded-full shadow-lg">تصفح المنتجات</a>
  </section>

  <!-- Products -->
  <main id="products" class="max-w-7xl mx-auto px-4 py-16">
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      <!-- Products injected by JS -->
    </div>
  </main>

  <!-- Cart Drawer -->
  <div id="cart-drawer" class="fixed inset-0 bg-black/60 z-50 hidden" onclick="toggleCart()">
    <div class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white shadow-xl p-6 flex flex-col justify-between" onclick="event.stopPropagation()">
      <div>
        <div class="flex justify-between items-center border-b pb-4">
          <h2 class="text-xl font-bold">سلة المشتريات</h2>
          <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div id="cart-items" class="mt-4 space-y-4 max-h-96 overflow-y-auto">
          <!-- Cart items injected by JS -->
        </div>
      </div>
      <div class="border-t pt-4">
        <div class="flex justify-between text-lg font-bold mb-4">
          <span>الإجمالي:</span>
          <span id="cart-total">0 ج.م</span>
        </div>
        <button onclick="checkout()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-md">إتمام الشراء</button>
      </div>
    </div>
  </div>

  <script>
    const PRODUCTS = [
      { id: 1, name: 'تيشيرت قطن فاخر', price: 350, image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500' },
      { id: 2, name: 'حذاء رياضي مريح', price: 850, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500' },
      { id: 3, name: 'ساعة يد كلاسيكية', price: 1200, image: 'https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=500' },
      { id: 4, name: 'نظارة شمسية أنيقة', price: 450, image: 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500' }
    ];

    let cart = [];

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = PRODUCTS.map(p => `
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border">
          <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
          <div class="p-4">
            <h3 class="font-bold text-lg mb-2">${p.name}</h3>
            <div class="flex justify-between items-center">
              <span class="text-xl font-bold text-indigo-600">${p.price} ج.م</span>
              <button onclick="addToCart(${p.id})" class="bg-gray-900 text-white px-4 py-2 rounded-lg hover:bg-indigo-600">إضافة</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      updateCartUI();
      toggleCart(true);
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartUI();
    }

    function updateQuantity(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) removeFromCart(productId);
        else updateCartUI();
      }
    }

    function updateCartUI() {
      const itemsContainer = document.getElementById('cart-items');
      const countBadge = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');
      
      const totalCount = cart.reduce((sum, i) => sum + i.quantity, 0);
      const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
      
      countBadge.innerText = totalCount;
      totalEl.innerText = totalPrice + ' ج.م';

      if (cart.length === 0) {
        itemsContainer.innerHTML = '<p class="text-center text-gray-400 py-8">السلة فارغة</p>';
        return;
      }

      itemsContainer.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between border-b pb-4">
          <div class="flex items-center gap-3">
            <img src="${item.image}" class="w-16 h-16 rounded object-cover">
            <div>
              <h4 class="font-bold">${item.name}</h4>
              <p class="text-indigo-600">${item.price} ج.م</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="updateQuantity(${item.id}, -1)" class="px-2 py-1 bg-gray-100 rounded">-</button>
            <span>${item.quantity}</span>
            <button onclick="updateQuantity(${item.id}, 1)" class="px-2 py-1 bg-gray-100 rounded">+</button>
            <button onclick="removeFromCart(${item.id})" class="text-red-500 ml-2"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    function toggleCart(open) {
      const drawer = document.getElementById('cart-drawer');
      if (open !== undefined) {
        drawer.classList.toggle('hidden', !open);
      } else {
        drawer.classList.toggle('hidden');
      }
    }

    function checkout() {
      alert('تم إتمام الطلب بنجاح!');
      cart = [];
      updateCartUI();
      toggleCart(false);
    }

    renderProducts();
  </script>
</body>
</html>
